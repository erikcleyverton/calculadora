<!-- Este container (.calculadora-card) é essencial para o CSS funcionar -->
<div class="calculadora-card">
    <h2>Calculadora</h2>
  
    <!-- Outro container (.input-group) para organizar os campos -->
    <div class="input-group">
      <input type="number" [(ngModel)]="numero1" placeholder="Primeiro número">
      <input type="number" [(ngModel)]="numero2" placeholder="Segundo número">
    </div>
  
    <!-- Container (.botoes) para os botões -->
    <div class="botoes">
      <button (click)="somar()">+</button>
      <button (click)="subtrair()">-</button>
      <button (click)="multiplicar()">*</button>
      <button (click)="dividir()">/</button>
    </div>
  
    <!-- Container (.resultado) para o resultado -->
    <div class="resultado">
      Resultado: {{ resultado }}
    </div>
  </div>
